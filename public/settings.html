<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Gauge Targets</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<style>
  .settings { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
  .settings h1 { font-size: 20px; margin: 0 0 4px; }
  .settings p.lead { color: var(--text-2); margin: 0 0 20px; }
  .settings form { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: grid; gap: 16px; }
  .field label { display: block; font-weight: 600; margin-bottom: 2px; }
  .field .hint { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .money { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
  .money span { padding: 0 4px 0 12px; color: var(--text-2); font-size: 18px; }
  .money input, .pin input { flex: 1; width: 100%; border: 0; background: transparent; padding: 10px 12px 10px 2px; font-size: 18px; font-variant-numeric: tabular-nums; outline: none; }
  .pin input { border: 1px solid var(--border); border-radius: 8px; background: var(--bg); padding: 10px 12px; }
  .money:focus-within, .pin input:focus { border-color: var(--accent); }
  .actions { display: flex; align-items: center; gap: 14px; }
  .actions button { padding: 11px 22px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
  .actions button:disabled { opacity: .6; cursor: default; }
  .msg { font-size: 14px; }
  .msg.ok { color: var(--good); }
  .msg.err { color: var(--critical-ink); }
  .back { display: inline-block; margin-top: 16px; }
</style>
</head>
<body>
<div class="settings">
  <h1>Gauge targets</h1>
  <p class="lead">Type a new target and click Save. The gauges update within a minute.</p>
  <form id="f" autocomplete="off">
    <div class="field">
      <label for="receivedToday">Received Today</label>
      <div class="hint">Dollar total of jobs entered in one day</div>
      <div class="money"><span>$</span><input id="receivedToday" inputmode="decimal"></div>
    </div>
    <div class="field">
      <label for="shippedToday">Shipped Today</label>
      <div class="hint">Dollar total shipped in one day</div>
      <div class="money"><span>$</span><input id="shippedToday" inputmode="decimal"></div>
    </div>
    <div class="field">
      <label for="shippedMonth">Shipped This Month</label>
      <div class="hint">Dollar total shipped in the month</div>
      <div class="money"><span>$</span><input id="shippedMonth" inputmode="decimal"></div>
    </div>
    <div class="field">
      <label for="shippedYear">Shipped This Year</label>
      <div class="hint">Dollar total shipped in the calendar year</div>
      <div class="money"><span>$</span><input id="shippedYear" inputmode="decimal"></div>
    </div>
    <div class="field pin" id="pinField" hidden>
      <label for="pin">PIN</label>
      <div class="hint">Needed to save changes</div>
      <input id="pin" type="password" inputmode="numeric">
    </div>
    <div class="actions">
      <button type="submit" id="save">Save targets</button>
      <span class="msg" id="msg" role="status"></span>
    </div>
  </form>
  <a class="back" href="/">← Back to dashboard</a>
</div>
<script>
  const KEYS = ['receivedToday', 'shippedToday', 'shippedMonth', 'shippedYear'];
  const fmt = (v) => Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const $ = (id) => document.getElementById(id);
  const msg = (t, cls) => { $('msg').textContent = t; $('msg').className = 'msg ' + (cls || ''); };

  async function load() {
    const res = await fetch('/api/settings', { cache: 'no-store' });
    if (res.status === 401) { location.href = '/login?next=/settings'; return; }
    const d = await res.json();
    KEYS.forEach((k) => { $(k).value = fmt(d.targets[k] || 0); });
    $('pinField').hidden = !d.pinRequired;
  }

  // Tidy the number when you leave a box: 15833.4 -> 15,833.40
  KEYS.forEach((k) => $(k).addEventListener('blur', () => {
    const v = Number($(k).value.replace(/[$,\s]/g, ''));
    if ($(k).value.trim() && isFinite(v)) $(k).value = fmt(v);
  }));

  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const targets = {};
    for (const k of KEYS) {
      const v = Number($(k).value.replace(/[$,\s]/g, ''));
      if (!isFinite(v) || v < 0) { msg('Check the ' + $(k).closest('.field').querySelector('label').textContent + ' amount.', 'err'); $(k).focus(); return; }
      targets[k] = v;
    }
    $('save').disabled = true; msg('Saving…');
    try {
      const res = await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ targets, pin: $('pin').value }) });
      const d = await res.json();
      if (!res.ok) throw new Error(d.error || 'Could not save');
      KEYS.forEach((k) => { $(k).value = fmt(d.targets[k]); });
      msg('Saved ✓', 'ok');
    } catch (err) {
      msg(err.message, 'err');
    } finally {
      $('save').disabled = false;
    }
  });

  load();
</script>
</body>
</html>
