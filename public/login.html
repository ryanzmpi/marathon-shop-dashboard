<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Shop Dashboard Login</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/login.css">
</head>
<body>
<div class="login">
  <form method="post" action="/login">
    <h1>Marathon Printing · Shop Dashboard</h1>
    <input type="password" name="password" placeholder="Dashboard password" autocomplete="current-password" autofocus required aria-label="Password">
    <input type="hidden" name="next" id="next">
    <div class="err" id="err" hidden>That password didn’t work.</div>
    <button type="submit">Open dashboard</button>
  </form>
</div>
<script>
  const p = new URLSearchParams(location.search);
  document.getElementById('next').value = p.get('next') || '/';
  if (p.get('bad')) document.getElementById('err').hidden = false;
</script>
</body>
</html>
